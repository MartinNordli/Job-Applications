<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jobbsøknader 2027</title>
<meta name="description" content="Personlig oversikt over jobbsøknader — frister, sendte søknader og status.">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#EDEBE5">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;600;700&family=Martian+Mono:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="src/stiler.css">
</head>
<body>
<div class="skall">

  <aside class="side">
    <div class="merke">
      <h1 class="merke__navn">Jobbsøknader</h1>
      <span class="merke__ar">2027</span>
    </div>

    <button class="nyknapp" id="apneNy" type="button" aria-label="Legg til søknad">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true"><path d="M7 2.4v9.2M2.4 7h9.2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      Legg til søknad
    </button>

    <nav class="nav" id="faner" role="tablist" aria-label="Visninger">
      <p class="nav__merke">Oversikt</p>
      <button class="nav__post" role="tab" data-visning="frister" aria-selected="true">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><rect x="2.2" y="3.2" width="11.6" height="10.6" rx="2.2" stroke="currentColor" stroke-width="1.4"/><path d="M2.2 6.6h11.6M5.6 1.8v2.4M10.4 1.8v2.4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
        Frister <span class="nav__tall" id="tallFrister"></span>
      </button>
      <button class="nav__post" role="tab" data-visning="sendt" aria-selected="false">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M13.8 2.2 7.4 8.6M13.8 2.2 9.7 13.8 7.4 8.6 2.2 6.3 13.8 2.2Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>
        Sendt <span class="nav__tall" id="tallSendt"></span>
      </button>
      <button class="nav__post" role="tab" data-visning="arkiv" aria-selected="false">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><rect x="2.2" y="5.4" width="11.6" height="8.4" rx="1.8" stroke="currentColor" stroke-width="1.4"/><rect x="1.6" y="2.2" width="12.8" height="3.2" rx="1.2" stroke="currentColor" stroke-width="1.4"/><path d="M6.4 8.8h3.2" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
        Arkiv <span class="nav__tall" id="tallArkiv"></span>
      </button>
      <button class="nav__post" role="tab" data-visning="tall" aria-selected="false">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M2.4 13.6h11.2M4.8 13.6V8.4M8 13.6V3.6M11.2 13.6v-3.6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        Tall
      </button>
    </nav>

    <div class="sidefot">
      <div class="neste" id="neste"></div>
      <p class="lagret" id="lagringstilstand" role="status" aria-live="polite"></p>
      <button class="sidelenke" id="apneEksport" type="button">Dataene dine</button>
    </div>
  </aside>

  <main class="hoved">
    <div class="stripe" id="stripe" role="alert" hidden></div>
    <div class="tittelrad">
      <div>
        <h2 class="tittel" id="sidetittel">Frister</h2>
        <p class="tittel__und" id="sideUnder"></p>
      </div>
      <div class="sok">
        <label class="skjult" for="sok">Søk i søknader</label>
        <input class="sok__felt" id="sok" type="search" placeholder="Søk selskap eller stilling" autocomplete="off">
        <span class="sok__ikon" aria-hidden="true"><svg width="15" height="15" viewBox="0 0 15 15" fill="none"><circle cx="6.4" cy="6.4" r="4.6" stroke="currentColor" stroke-width="1.5"/><path d="M9.9 9.9 13 13" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></span>
        <span class="sok__hint" aria-hidden="true">/</span>
      </div>
    </div>

    <div class="filtre">
      <label class="skjult" for="filtSektor">Sektor</label>
      <select class="velg" id="filtSektor"><option value="">Alle sektorer</option></select>
      <label class="skjult" for="filtSted">Sted</label>
      <select class="velg" id="filtSted"><option value="">Alle steder</option></select>
      <button class="nullstill" id="nullstill" type="button" hidden>Nullstill filtre</button>
    </div>

    <section class="fl" id="fristlinje" aria-label="Frister framover">
      <div class="fl__plot"><div class="fl__flate" id="flFlate"></div></div>
      <button class="fl__lopende" id="flLopende" type="button">
        <span class="fl__lopendeTall" id="flLopendeTall">0</span>
        <span class="fl__lopendeEtikett">løpende<br>ingen frist</span>
      </button>
    </section>

    <div id="innhold"></div>
  </main>
</div>

<div class="slor" id="slor"></div>

<aside class="skuff" id="skuff" role="dialog" aria-modal="true" aria-hidden="true" aria-labelledby="skuffTittel" tabindex="-1">
  <div class="skuff__topp">
    <h2 class="skuff__tittel" id="skuffTittel">Legg til søknad</h2>
    <button class="knapp knapp--stille" id="lukkSkuff" type="button" aria-label="Lukk">✕</button>
  </div>
  <div class="skuff__kropp" id="skuffKropp"></div>
  <div class="skuff__bunn" id="skuffBunn"></div>
</aside>

<div class="tips" id="tips" role="status"></div>
<div class="varsel" id="varsel" role="status" inert></div>

<script>
/* Åpnes filen rett fra disk i stedet for gjennom serveren, blokkerer
   nettleseren ES-moduler, og siden blir stående tom uten å si hvorfor. */
addEventListener("DOMContentLoaded", () => setTimeout(() => {
  if(window.__jobbsoknaderKjorer) return;
  const el = document.getElementById("innhold");
  if(!el) return;
  el.innerHTML = '<div class="tomt"><p class="tomt__tittel">Appen trenger serveren</p>'
    + '<p class="tomt__tekst">Kjør <code>npm start</code> i prosjektmappa og åpne '
    + '<a href="http://127.0.0.1:4173">127.0.0.1:4173</a>. Søknadene ligger i '
    + '<code>data/jobber.json</code>, og siden når dem bare gjennom serveren.</p></div>';
}, 1500));
</script>
<script type="module" src="src/app.js"></script>
</body>
</html>
