[package]
name = "jobbsoknader"
version = "1.0.0"
description = "Personlig oversikt over jobbsøknader"
authors = ["Martin Nordli"]
edition = "2021"

[lib]
name = "jobbsoknader_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "charset"] }
# Allerede i treet via Tauri; vi trenger bare sleep til det nye forsøket.
tokio = { version = "1", features = ["time", "rt", "sync"] }
rfd = "0.15"
# Fristvarselet: lokal dato, systemvarselet og uid-en launchctl trenger.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
mac-notification-sys = "0.6"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
